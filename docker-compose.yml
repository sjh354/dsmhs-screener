services:
  instructor:
    build:
      context: .
      dockerfile: docker/instructor.Dockerfile
    ports:
      - "4000:4000"
    networks:
      classroom:
        ipv4_address: 172.28.0.10

  student-a:
    build:
      context: .
      dockerfile: docker/student.Dockerfile
    environment:
      STUDENT_NAME: student-a
      INSTRUCTOR_URL: http://instructor:4000
    depends_on:
      - instructor
    networks:
      classroom:
        ipv4_address: 172.28.0.11

  student-b:
    build:
      context: .
      dockerfile: docker/student.Dockerfile
    environment:
      STUDENT_NAME: student-b
      INSTRUCTOR_URL: http://instructor:4000
    depends_on:
      - instructor
    networks:
      classroom:
        ipv4_address: 172.28.0.12

  student-c:
    build:
      context: .
      dockerfile: docker/student.Dockerfile
    environment:
      STUDENT_NAME: student-c
      INSTRUCTOR_URL: http://instructor:4000
    depends_on:
      - instructor
    networks:
      classroom:
        ipv4_address: 172.28.0.13

networks:
  classroom:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
