<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSMHS 엔드포인트 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; display: flex; flex-direction: column; height: 100vh; }

    header {
      background: #2563eb; color: #fff; padding: 12px 20px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
    #refresh-info { font-size: 0.8rem; opacity: 0.8; white-space: nowrap; }

    #config-btn {
      margin-left: auto;
      padding: 4px 12px; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px;
      background: transparent; color: #fff; font-size: 0.85rem; cursor: pointer;
      white-space: nowrap;
    }
    #config-btn:hover { background: rgba(255,255,255,0.15); }

    #stats { padding: 8px 20px; font-size: 0.85rem; color: #555; flex-shrink: 0; }

    #table-wrap { flex: 1; overflow: auto; padding: 0 20px 20px; }

    table { border-collapse: collapse; min-width: 100%; white-space: nowrap; }

    thead th {
      position: sticky; top: 0; z-index: 2;
      background: #1e40af; color: #fff;
      padding: 10px 14px; font-size: 0.8rem; font-weight: 600;
      border-right: 1px solid #3b82f6;
    }
    thead th:first-child {
      position: sticky; left: 0; z-index: 3;
      min-width: 180px;
    }

    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eff6ff; }

    tbody td {
      padding: 10px 14px; border-right: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb; font-size: 0.85rem; text-align: center;
    }
    tbody td:first-child {
      position: sticky; left: 0; z-index: 1;
      background: inherit; text-align: left;
      font-weight: 600; min-width: 180px;
      border-right: 2px solid #93c5fd;
    }
    .student-ip { font-size: 0.75rem; font-weight: 400; color: #6b7280; font-family: monospace; }
    .badge { font-size: 0.7rem; padding: 1px 6px; border-radius: 999px; margin-left: 4px; }
    .badge-alive { background: #dcfce7; color: #16a34a; }
    .badge-offline { background: #fee2e2; color: #dc2626; }
    .badge-unregistered { background: #f3f4f6; color: #9ca3af; }

    .cell-ok { background: #22c55e; color: #fff; font-weight: 700; border-radius: 4px; padding: 4px 10px; }
    .cell-fail { background: #ef4444; color: #fff; font-weight: 700; border-radius: 4px; padding: 4px 10px; }
    .cell-skip { background: #d1d5db; color: #6b7280; border-radius: 4px; padding: 4px 10px; }

    #empty { display: none; text-align: center; color: #aaa; padding: 60px 0; font-size: 1rem; }

    #lock-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #1e3a8a;
      display: flex; align-items: center; justify-content: center;
    }
    #lock-box {
      background: #fff; border-radius: 12px; padding: 40px 48px;
      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      min-width: 300px;
    }
    #lock-box h2 { color: #2563eb; font-size: 1.2rem; margin-bottom: 8px; }
    #lock-box p { color: #6b7280; font-size: 0.85rem; margin-bottom: 24px; }
    #lock-input {
      width: 100%; padding: 10px 14px; font-size: 1rem;
      border: 2px solid #d1d5db; border-radius: 6px; outline: none;
      margin-bottom: 12px; text-align: center; letter-spacing: 2px;
    }
    #lock-input:focus { border-color: #2563eb; }
    #lock-btn {
      width: 100%; padding: 10px; background: #2563eb; color: #fff;
      border: none; border-radius: 6px; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    #lock-btn:hover { background: #1d4ed8; }
    #lock-error { color: #dc2626; font-size: 0.85rem; margin-top: 10px; min-height: 20px; }
  </style>
</head>
<body>
  <div id="lock-overlay">
    <div id="lock-box">
      <h2>DSMHS 강사 대시보드</h2>
      <p>접근하려면 암호를 입력하세요.</p>
      <input id="lock-input" type="password" placeholder="암호 입력" autofocus>
      <button id="lock-btn" onclick="unlock()">확인</button>
      <div id="lock-error"></div>
    </div>
  </div>
  <script>
    (function () {
      if (sessionStorage.getItem('dsmhs_auth') === '1') {
        document.getElementById('lock-overlay').style.display = 'none';
      }
      document.getElementById('lock-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') unlock();
      });
    })();
    function unlock() {
      const val = document.getElementById('lock-input').value;
      if (val === '2026spring') {
        sessionStorage.setItem('dsmhs_auth', '1');
        document.getElementById('lock-overlay').style.display = 'none';
      } else {
        document.getElementById('lock-error').textContent = '암호가 올바르지 않습니다.';
        document.getElementById('lock-input').value = '';
        document.getElementById('lock-input').focus();
      }
    }
  </script>
  <header>
    <h1>DSMHS 엔드포인트 테스트</h1>
    <span id="refresh-info">5초마다 자동 갱신</span>
    <button id="config-btn" onclick="document.getElementById('config-file').click()">수업 설정 불러오기</button>
    <input id="config-file" type="file" accept=".json" style="display:none" onchange="loadConfig(this)">
  </header>

  <p id="stats"></p>
  <div id="table-wrap">
    <table id="tbl">
      <thead><tr id="hdr-row"></tr></thead>
      <tbody id="tbl-body"></tbody>
    </table>
    <p id="empty">수업 설정 파일을 불러오세요.</p>
  </div>

  <script>
    let endpoints = [];
    let students = [];

    async function loadConfig(input) {
      const file = input.files[0];
      if (!file) return;
      input.value = '';
      let config;
      try {
        const text = await file.text();
        config = JSON.parse(text);
        if (!Array.isArray(config.students) || !Array.isArray(config.endpoints)) throw new Error();
      } catch {
        alert('올바른 형식의 JSON 파일이 아닙니다.\n예:\n{\n  "students": ["홍길동", "김철수"],\n  "endpoints": [{"method": "GET", "path": "/health"}]\n}');
        return;
      }
      try {
        const res = await fetch('/screener/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config),
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error || '설정 업로드 실패'); return; }
        document.getElementById('config-btn').textContent =
          `설정 완료 (학생 ${data.studentCount}명 · 엔드포인트 ${data.endpointCount}개)`;
        await refresh();
      } catch { alert('설정 업로드에 실패했습니다.'); }
    }

    function render() {
      const hdr = document.getElementById('hdr-row');
      const tbody = document.getElementById('tbl-body');
      const empty = document.getElementById('empty');
      const stats = document.getElementById('stats');

      const alive = students.filter(s => s.alive).length;
      const unregistered = students.filter(s => !s.registered).length;
      stats.textContent = `총 ${students.length}명 | 접속 중 ${alive}명` +
        (unregistered ? ` | 미접속 ${unregistered}명` : '');

      hdr.innerHTML = '<th>학생</th>' + endpoints.map(ep =>
        `<th>${ep.label}</th>`
      ).join('');

      if (students.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      tbody.innerHTML = [...students]
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(s => {
          const addr = s.port ? `${s.ip}:${s.port}` : (s.ip || '');
          const badge = s.alive
            ? '<span class="badge badge-alive">접속 중</span>'
            : s.registered
              ? '<span class="badge badge-offline">오프라인</span>'
              : '<span class="badge badge-unregistered">미접속</span>';
          const cells = endpoints.map(ep => {
            if (!s.alive) return '<td><span class="cell-skip">—</span></td>';
            const result = (s.probeResults || {})[ep.label];
            if (!result) return '<td><span class="cell-skip">—</span></td>';
            if (result.ok) return '<td><span class="cell-ok">O</span></td>';
            return '<td><span class="cell-fail">X</span></td>';
          }).join('');
          return `<tr>
            <td><div>${s.name}${badge}</div><div class="student-ip">${addr}</div></td>
            ${cells}
          </tr>`;
        }).join('');
    }

    async function refresh() {
      try {
        const [epRes, stRes] = await Promise.all([
          fetch('/screener/endpoints'),
          fetch('/screener/students'),
        ]);
        endpoints = await epRes.json();
        students = await stRes.json();
        render();
      } catch { /* 네트워크 오류 무시 */ }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
